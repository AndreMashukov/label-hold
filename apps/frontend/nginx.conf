# nginx config for the React SPA on Cloud Run.
# - Listens on 8080
# - SPA fallback to /index.html for client-side routing
# - Long-lived cache for /assets/*, no-cache for index.html
# - Adds CORS headers so the SPA can be tested cross-origin if needed.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Hashed Vite assets are content-addressable; cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shell is the entry point for all client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Quiet 404 on missing favicon.
    location = /favicon.ico { log_not_found off; access_log off; }
}
