steps:
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - --tag=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_APP_NAME}:latest
  - -f
  - apps/${_APP_NAME}/Dockerfile
  - .
images:
- ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_APP_NAME}:latest
substitutions:
  _REGION: asia-southeast1
  _PROJECT_ID: your-gcp-project-id
  _REPO: pastebin-apps-dev
  _APP_NAME: author-bff
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
